name: Cypress Tests + GitHub Pages

on:
  push:
    branches:
      - main
      - exercicios/modulo-4
  pull_request:
    branches:
      - main
      - exercicios/modulo-4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes Cypress
        run: npx cypress run --spec "cypress/e2e/m22/account_create-cy.js,cypress/e2e/m23/login.cy.js"
        continue-on-error: true

      - name: Preparar resultado para publicação
        run: |
          mkdir -p public

          if [ -d "cypress/reports/html" ]; then
            cp -r cypress/reports/html/* public/
          fi

          if [ ! -f "public/index.html" ]; then
            echo "<h1>Relatório de Testes Cypress</h1>" > public/index.html
            echo "<p>Testes executados automaticamente via GitHub Actions.</p>" >> public/index.html
            echo "<p>Projeto: EBAC Cypress Profissional</p>" >> public/index.html
            echo "<p>Branch: $GITHUB_REF_NAME</p>" >> public/index.html
          fi

      - name: Publicar resultado no GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public